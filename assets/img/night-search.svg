<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050f0b"/>
      <stop offset="0.6" stop-color="#0b1f16"/>
      <stop offset="1" stop-color="#123125"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f0d060" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f0d060" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky2)"/>

  <!-- estrellas -->
  <g fill="#f0d060">
    <circle cx="140" cy="70" r="1.6" opacity="0.8"/><circle cx="300" cy="120" r="1.1" opacity="0.5"/>
    <circle cx="520" cy="60" r="1.7" opacity="0.85"/><circle cx="760" cy="110" r="1.2" opacity="0.55"/>
