  <polygon points="900,800 1020,800 1180,120 1080,120" fill="url(#beam)" opacity="0.7"/>
  <circle cx="250" cy="795" r="26" fill="#f0d060" opacity="0.5"/>
  <circle cx="250" cy="795" r="46" fill="#f0d060" opacity="0.15"/>
  <circle cx="960" cy="795" r="22" fill="#f0d060" opacity="0.45"/>
