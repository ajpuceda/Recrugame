<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Radar screen">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e7d54" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#2e7d54" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af37" stop-opacity=".0"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity=".45"/>
    </linearGradient>
    <clipPath id="scope"><circle cx="400" cy="300" r="240"/></clipPath>
  </defs>

  <rect width="800" height="600" fill="#0b1f16"/>
  <circle cx="400" cy="300" r="290" fill="url(#glow)"/>

  <!-- Anillos concéntricos -->
  <g fill="none" stroke="#1f5c3d" stroke-width="1.2" opacity=".8">
    <circle cx="400" cy="300" r="240"/>
    <circle cx="400" cy="300" r="180"/>
    <circle cx="400" cy="300" r="120"/>
    <circle cx="400" cy="300" r="60"/>
  </g>
  <circle cx="400" cy="300" r="240" fill="none" stroke="#2e7d54" stroke-width="2"/>
  <circle cx="400" cy="300" r="3" fill="#2e7d54"/>

  <!-- Cruces de retícula -->
  <g stroke="#1f5c3d" stroke-width="1" opacity=".7">
    <line x1="400" y1="60" x2="400" y2="540"/>
    <line x1="160" y1="300" x2="640" y2="300"/>
    <line x1="230" y1="130" x2="570" y2="470"/>
    <line x1="230" y1="470" x2="570" y2="130"/>
  </g>

  <!-- Barrido rotatorio -->
  <g clip-path="url(#scope)">
    <g transform="rotate(0 400 300)">
      <path d="M400 300 L640 300 A240 240 0 0 0 553 130 Z" fill="url(#sweep)"/>
      <line x1="400" y1="300" x2="640" y2="300" stroke="#d4af37" stroke-width="2" opacity=".8"/>
      <animateTransform attributeName="transform" type="rotate" from="0 400 300" to="360 400 300" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Blips dorados -->
  <g fill="#d4af37">
    <circle cx="505" cy="215" r="5">
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="380" r="4">
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="470" cy="400" r="3">
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="285" cy="230" r="3">
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Panel decorativo inferior -->
  <g font-family="Consolas, Menlo, monospace" fill="#2e7d54" font-size="12" opacity=".8">
    <text x="60" y="556">SCAN · ACTIVE</text>
    <text x="560" y="556">GAIN ▮▮▮▯</text>
    <text x="60" y="42">SECTOR 04 — WARSZAWA</text>
    <text x="600" y="42">07:14</text>
  </g>
</svg>
