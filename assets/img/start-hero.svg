<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050f0b"/>
      <stop offset="0.55" stop-color="#0b1f16"/>
      <stop offset="0.85" stop-color="#123125"/>
      <stop offset="1" stop-color="#1a4230"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0d060" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#f0d060" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f0d060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizonGlow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#d4af37" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <ellipse cx="600" cy="820" rx="900" ry="380" fill="url(#horizonGlow)"/>

  <!-- estrellas -->
  <g fill="#f0d060">
    <circle cx="90" cy="80" r="1.8" opacity="0.9"/><circle cx="210" cy="150" r="1.2" opacity="0.6"/>
    <circle cx="330" cy="60" r="1.6" opacity="0.8"/><circle cx="455" cy="190" r="1" opacity="0.5"/>
    <circle cx="560" cy="110" r="1.4" opacity="0.7"/><circle cx="700" cy="70" r="1.9" opacity="0.9"/>
    <circle cx="820" cy="170" r="1.1" opacity="0.55"/><circle cx="1060" cy="90" r="1.5" opacity="0.75"/>
    <circle cx="1140" cy="230" r="1.2" opacity="0.6"/><circle cx="160" cy="260" r="1.3" opacity="0.65"/>
    <circle cx="640" cy="250" r="1" opacity="0.5"/><circle cx="950" cy="300" r="1.1" opacity="0.5"/>
  </g>

  <!-- luna -->
  <circle cx="950" cy="150" r="80" fill="url(#moonGlow)"/>
  <circle cx="950" cy="150" r="42" fill="#f0d060" opacity="0.92"/>
  <circle cx="935" cy="138" r="6" fill="#e0c050" opacity="0.5"/>
  <circle cx="962" cy="160" r="4" fill="#e0c050" opacity="0.4"/>

  <!-- skyline lejano -->
  <g fill="#0a2418">
    <rect x="0" y="470" width="70" height="330"/>
    <rect x="80" y="430" width="55" height="370"/>
    <rect x="145" y="500" width="80" height="300"/>
    <rect x="235" y="450" width="60" height="350"/>
    <rect x="305" y="520" width="90" height="280"/>
    <rect x="405" y="470" width="65" height="330"/>
    <rect x="480" y="540" width="110" height="260"/>
    <rect x="600" y="460" width="70" height="340"/>
    <rect x="680" y="510" width="95" height="290"/>
    <rect x="785" y="440" width="60" height="360"/>
    <rect x="855" y="500" width="85" height="300"/>
    <rect x="950" y="465" width="65" height="335"/>
    <rect x="1025" y="525" width="90" height="275"/>
    <rect x="1125" y="480" width="75" height="320"/>
  </g>

  <!-- skyline cercano (silueta oscura) -->
  <g fill="#06110c">
    <rect x="-20" y="580" width="120" height="220"/>
    <rect x="120" y="620" width="100" height="180"/>
    <rect x="260" y="600" width="80" height="200"/>
    <rect x="390" y="650" width="130" height="150"/>
    <rect x="560" y="610" width="90" height="190"/>
    <rect x="700" y="640" width="120" height="160"/>
    <rect x="860" y="600" width="85" height="200"/>
    <rect x="990" y="655" width="110" height="145"/>
    <rect x="1130" y="615" width="90" height="185"/>
    <polygon points="260,600 300,555 340,600"/>
  </g>

  <!-- ventanas iluminadas doradas -->
  <g fill="#f0d060">
    <rect x="98" y="452" width="7" height="10" opacity="0.85"/><rect x="112" y="452" width="7" height="10" opacity="0.5"/>
    <rect x="98" y="478" width="7" height="10" opacity="0.4"/><rect x="126" y="478" width="7" height="10" opacity="0.8"/>
    <rect x="252" y="472" width="7" height="10" opacity="0.85"/><rect x="266" y="472" width="7" height="10" opacity="0.45"/>
    <rect x="252" y="500" width="7" height="10" opacity="0.6"/>
    <rect x="422" y="492" width="7" height="10" opacity="0.8"/><rect x="436" y="492" width="7" height="10" opacity="0.35"/>
    <rect x="422" y="520" width="7" height="10" opacity="0.7"/>
    <rect x="612" y="482" width="7" height="10" opacity="0.85"/><rect x="626" y="482" width="7" height="10" opacity="0.5"/>
    <rect x="612" y="510" width="7" height="10" opacity="0.4"/>
    <rect x="803" y="462" width="7" height="10" opacity="0.85"/><rect x="817" y="462" width="7" height="10" opacity="0.55"/>
    <rect x="803" y="490" width="7" height="10" opacity="0.7"/>
    <rect x="963" y="487" width="7" height="10" opacity="0.8"/><rect x="977" y="487" width="7" height="10" opacity="0.4"/>
    <rect x="963" y="515" width="7" height="10" opacity="0.6"/>
    <rect x="1042" y="547" width="7" height="10" opacity="0.75"/><rect x="1056" y="547" width="7" height="10" opacity="0.45"/>
    <rect x="1143" y="502" width="7" height="10" opacity="0.85"/><rect x="1157" y="502" width="7" height="10" opacity="0.5"/>
  </g>

  <!-- antenas -->
  <g stroke="#06110c" stroke-width="4">
    <line x1="300" y1="555" x2="300" y2="510"/>
    <line x1="980" y1="465" x2="980" y2="420"/>
  </g>
  <circle cx="300" cy="508" r="4" fill="#e06666" opacity="0.9"/>
  <circle cx="980" cy="418" r="4" fill="#e06666" opacity="0.9"/>
</svg>
