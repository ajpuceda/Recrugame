<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="stormSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#150b0b"/>
      <stop offset="0.5" stop-color="#0b1a14"/>
      <stop offset="1" stop-color="#0b1f16"/>
    </linearGradient>
    <radialGradient id="flash" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#f0d060" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f0d060" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#stormSky)"/>
  <ellipse cx="640" cy="220" rx="600" ry="420" fill="url(#flash)"/>

  <!-- nubes de tormenta -->
  <g fill="#0a1410" opacity="0.95">
    <ellipse cx="200" cy="120" rx="240" ry="90"/>
    <ellipse cx="620" cy="80" rx="280" ry="100"/>
    <ellipse cx="1020" cy="140" rx="260" ry="90"/>
    <ellipse cx="420" cy="190" rx="220" ry="70"/>
    <ellipse cx="840" cy="210" rx="240" ry="75"/>
  </g>

  <!-- relámpago -->
  <polyline points="700,70 660,200 716,200 610,390" stroke="#f0d060" stroke-width="18" fill="none" opacity="0.18" stroke-linejoin="round"/>
  <polyline points="700,70 660,200 716,200 610,390" stroke="#f0d060" stroke-width="5" fill="none" stroke-linejoin="round"/>

  <!-- torre rival -->
  <g>
    <rect x="520" y="280" width="170" height="520" fill="#081a12" stroke="#12251b" stroke-width="3"/>
    <polygon points="520,280 605,220 690,280" fill="#081a12"/>
    <line x1="605" y1="220" x2="605" y2="170" stroke="#081a12" stroke-width="6"/>
    <circle cx="605" cy="166" r="6" fill="#e06666"/>
    <!-- ventanas rojas -->
    <g fill="#e06666">
      <rect x="542" y="310" width="12" height="18" opacity="0.85"/><rect x="568" y="310" width="12" height="18" opacity="0.5"/>
      <rect x="594" y="310" width="12" height="18" opacity="0.7"/><rect x="620" y="310" width="12" height="18" opacity="0.4"/>
      <rect x="646" y="310" width="12" height="18" opacity="0.8"/>
      <rect x="542" y="360" width="12" height="18" opacity="0.5"/><rect x="594" y="360" width="12" height="18" opacity="0.85"/>
      <rect x="646" y="360" width="12" height="18" opacity="0.45"/><rect x="568" y="360" width="12" height="18" opacity="0.3"/>
      <rect x="542" y="410" width="12" height="18" opacity="0.75"/><rect x="568" y="410" width="12" height="18" opacity="0.4"/>
      <rect x="620" y="410" width="12" height="18" opacity="0.8"/><rect x="646" y="410" width="12" height="18" opacity="0.35"/>
      <rect x="594" y="460" width="12" height="18" opacity="0.6"/><rect x="646" y="460" width="12" height="18" opacity="0.7"/>
      <rect x="542" y="510" width="12" height="18" opacity="0.5"/><rect x="620" y="510" width="12" height="18" opacity="0.45"/>
      <rect x="568" y="560" width="12" height="18" opacity="0.6"/><rect x="646" y="560" width="12" height="18" opacity="0.3"/>
    </g>
    <!-- rótulo rival -->
    <rect x="548" y="620" width="114" height="34" rx="6" fill="#12251b" stroke="#e06666" stroke-opacity="0.6"/>
    <rect x="560" y="632" width="70" height="10" rx="4" fill="#e06666" opacity="0.7"/>
  </g>

  <!-- edificios vecinos -->
  <g fill="#06110c">
    <rect x="0" y="520" width="150" height="280"/>
    <rect x="180" y="580" width="120" height="200"/>
    <rect x="330" y="540" width="100" height="260"/>
    <rect x="740" y="560" width="130" height="240"/>
    <rect x="910" y="500" width="110" height="300"/>
    <rect x="1060" y="570" width="140" height="230"/>
  </g>
  <g fill="#f0d060">
    <rect x="30" y="550" width="7" height="10" opacity="0.5"/>
    <rect x="212" y="610" width="7" height="10" opacity="0.6"/>
    <rect x="360" y="570" width="7" height="10" opacity="0.4"/>
    <rect x="770" y="595" width="7" height="10" opacity="0.55"/>
    <rect x="940" y="535" width="7" height="10" opacity="0.5"/>
    <rect x="1100" y="605" width="7" height="10" opacity="0.45"/>
  </g>

  <!-- lluvia estilizada -->
  <g stroke="#9db8a8" stroke-width="2" opacity="0.16">
    <line x1="60" y1="80" x2="40" y2="150"/><line x1="200" y1="260" x2="180" y2="340"/>
    <line x1="340" y1="120" x2="320" y2="200"/><line x1="480" y1="320" x2="460" y2="410"/>
    <line x1="760" y1="250" x2="740" y2="330"/><line x1="900" y1="100" x2="880" y2="180"/>
    <line x1="1040" y1="300" x2="1020" y2="390"/><line x1="1150" y1="150" x2="1130" y2="230"/>
    <line x1="130" y1="420" x2="110" y2="500"/><line x1="980" y1="440" x2="960" y2="520"/>
    <line x1="420" y1="470" x2="400" y2="560"/><line x1="680" y1="450" x2="660" y2="540"/>
  </g>
</svg>
