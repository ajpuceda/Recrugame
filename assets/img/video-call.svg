<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050f0b"/>
      <stop offset="0.7" stop-color="#0b1f16"/>
      <stop offset="1" stop-color="#0e241a"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0d060" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f0d060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#2e7d54" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2e7d54" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#room)"/>

  <!-- ventana con ciudad nocturna -->
  <g>
    <rect x="840" y="120" width="270" height="330" rx="14" fill="#06110c" stroke="#1f5c3d" stroke-width="3"/>
    <line x1="975" y1="124" x2="975" y2="446" stroke="#1f5c3d" stroke-width="2"/>
    <line x1="844" y1="285" x2="1106" y2="285" stroke="#1f5c3d" stroke-width="2"/>
    <g fill="#f0d060">
      <rect x="870" y="330" width="8" height="12" opacity="0.8"/><rect x="892" y="356" width="8" height="12" opacity="0.5"/>
      <rect x="920" y="318" width="8" height="12" opacity="0.7"/><rect x="1005" y="342" width="8" height="12" opacity="0.6"/>
      <rect x="1030" y="326" width="8" height="12" opacity="0.8"/><rect x="1058" y="360" width="8" height="12" opacity="0.45"/>
    </g>
    <circle cx="930" cy="200" r="26" fill="#f0d060" opacity="0.85"/>
  </g>

  <!-- lámpara izquierda -->
  <ellipse cx="150" cy="200" rx="170" ry="170" fill="url(#lampGlow)"/>
  <line x1="150" y1="120" x2="150" y2="420" stroke="#122a1e" stroke-width="10"/>
  <path d="M110 120 q40 -46 80 0 z" fill="#d4af37" opacity="0.9"/>
  <circle cx="150" cy="130" r="10" fill="#f0d060"/>

  <!-- escritorio -->
  <rect x="0" y="560" width="1200" height="240" fill="#081a12"/>
  <rect x="0" y="560" width="1200" height="10" fill="#12251b"/>

  <!-- portátil: videollamada -->
  <ellipse cx="600" cy="420" rx="260" ry="200" fill="url(#screenGlow)"/>
  <g>
    <rect x="420" y="290" width="360" height="230" rx="14" fill="#0e241a" stroke="#2e7d54" stroke-width="3"/>
    <rect x="438" y="308" width="324" height="194" rx="8" fill="#123524"/>
    <!-- candidato en pantalla -->
    <circle cx="600" cy="382" r="34" fill="#0b1f16" stroke="#f0d060" stroke-width="2.5"/>
    <circle cx="600" cy="372" r="13" fill="#f0d060" opacity="0.9"/>
    <path d="M574 400 q26 -20 52 0 v18 h-52 z" fill="#f0d060" opacity="0.9"/>
    <!-- barra de chat inferior de la llamada -->
    <rect x="470" y="452" width="30" height="22" rx="6" fill="#1f5c3d"/>
    <rect x="512" y="452" width="30" height="22" rx="6" fill="#1f5c3d"/>
    <rect x="554" y="452" width="30" height="22" rx="6" fill="#1f5c3d"/>
    <circle cx="640" cy="463" r="11" fill="#e06666" opacity="0.9"/>
    <rect x="664" y="452" width="80" height="22" rx="6" fill="#1f5c3d"/>
    <!-- luz de grabación -->
    <circle cx="746" cy="318" r="5" fill="#e06666"/>
  </g>
  <polygon points="400,524 800,524 830,560 370,560" fill="#12251b" stroke="#1f5c3d" stroke-width="2"/>

  <!-- taza con vapor -->
  <g>
    <path d="M290 530 q-6 -14 4 -24 q10 -10 4 -22" stroke="#9db8a8" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M312 530 q-6 -14 4 -24 q10 -10 4 -22" stroke="#9db8a8" stroke-width="3" fill="none" opacity="0.35"/>
    <rect x="272" y="530" width="64" height="40" rx="8" fill="#122a1e" stroke="#2e7d54" stroke-width="2"/>
    <path d="M336 540 q16 10 0 22" stroke="#2e7d54" stroke-width="3" fill="none"/>
    <rect x="268" y="570" width="72" height="7" rx="3" fill="#06110c"/>
  </g>

  <!-- cuaderno y bolígrafo -->
  <g transform="rotate(-8 180 620)">
    <rect x="120" y="600" width="120" height="70" rx="6" fill="#122a1e" stroke="#1f5c3d" stroke-width="2"/>
    <line x1="150" y1="600" x2="150" y2="670" stroke="#d4af37" stroke-width="3" opacity="0.7"/>
    <line x1="164" y1="616" x2="222" y2="616" stroke="#2e7d54" stroke-width="3"/>
    <line x1="164" y1="632" x2="210" y2="632" stroke="#2e7d54" stroke-width="3"/>
    <line x1="164" y1="648" x2="218" y2="648" stroke="#2e7d54" stroke-width="3"/>
  </g>
  <line x1="250" y1="700" x2="300" y2="640" stroke="#f0d060" stroke-width="4" stroke-linecap="round"/>
</svg>
